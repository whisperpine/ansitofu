- name: Prepare
  hosts: all
  gather_facts: false
  no_log: "{{ molecule_no_log }}"
  tasks:
    - name: Verify python installation
      ansible.builtin.command:
        cmd: python3 --version
      register: python_version
      changed_when: false

    - name: Display python version
      ansible.builtin.debug:
        msg: "{{ python_version.stdout }}"
      no_log: false

    - name: Ensure sshd is up and running
      ansible.builtin.apt:
        name: [openssh-server]
        state: present
        update_cache: true
      no_log: true

    - name: Start sshd
      ansible.builtin.service:
        name: sshd
        state: started
      no_log: true
