- name: Install required dependencies
  ansible.builtin.apt:
    name: "{{ mongodb_dependencies }}"
    state: present
    update_cache: true
  no_log: true

- name: Download mongodb gpg key
  ansible.builtin.get_url:
    url: https://pgp.mongodb.com/server-{{ mongodb_version }}.asc
    dest: "{{ mongodb_key_file }}"
    mode: "0644"

- name: Add mongodb repository
  ansible.builtin.apt_repository:
    # Note: This is a workaround, since mongodb doesn't have a repo in Ubuntu
    # 26.04 LTS (resolute). Once mongdb supports Ubuntu 26.04 LTS, replace
    # `noble` with `{{ ansible_facts['distribution_release'] }}`. Check if
    # mongdb supports Ubuntu 26.04 LTS with this URL:
    # https://repo.mongodb.org/apt/ubuntu/dists/resolute/mongodb-org/8.0/InRelease
    repo: >-
      deb [arch=amd64 signed-by={{ mongodb_key_file }}]
      {{ mongodb_repo_url }}
      noble/mongodb-org/{{ mongodb_version }}
      multiverse
    state: present

- name: Install mongodb
  ansible.builtin.apt:
    name: mongodb-org
    state: present
  no_log: true

