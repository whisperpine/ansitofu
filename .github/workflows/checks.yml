name: Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    name: spell check with typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run typos command
        shell: nix shell --inputs-from . nixpkgs#typos --quiet --command bash {0}
        run: typos --hidden --exclude .git --format brief

  cocogitto:
    name: check conventional commits
    runs-on: ubuntu-latest
    # Only run this step in the main branch.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Check the latest commit message
        shell: nix shell --inputs-from . nixpkgs#cocogitto --quiet --command bash {0}
        run: cog check HEAD..HEAD

  rumdl:
    name: lint markdown by rumdl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run rumdl command
        shell: nix shell --inputs-from . nixpkgs#rumdl --quiet --command bash {0}
        run: rumdl check .

  ansible-lint:
    name: ansible lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run ansible-lint command
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        shell: nix shell --inputs-from . nixpkgs#sops nixpkgs#ansible-lint --quiet --command bash {0}
        run: |
          source <(sops decrypt --output-type dotenv encrypted.env)
          echo "$ANSIBLE_VAULT_PASSWORD" >.vault_pass.txt
          ansible-lint --strict

  trivy-scan:
    name: use trivy to scan files
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required to upload SARIF results to the Security tab
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run trivy vulnerability scanner in repo mode
        shell: nix shell --inputs-from . nixpkgs#trivy --quiet --command bash {0}
        run: |
          trivy --quiet fs . \
            --output trivy-fs-results.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            --skip-dirs ./target \
            --format sarif \
            --exit-code 1
          trivy --quiet config . \
            --output trivy-config-results.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            --skip-dirs ./target \
            --format sarif \
            --exit-code 1
      - name: Upload "trivy fs" results to GitHub Security tab
        if: ${{ success() || failure() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs-scan
      - name: Upload "trivy config" results to GitHub Security tab
        if: ${{ success() || failure() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config-scan

  tflint:
    name: lint opentofu code by tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run tflint command
        shell: nix shell --inputs-from . nixpkgs#tflint --quiet --command bash {0}
        run: tflint --chdir ./infra --recursive

  tofu-fmt:
    name: check formatting of opentofu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run OpenTofu commands
        shell: nix shell --inputs-from .. nixpkgs#opentofu --quiet --command bash {0}
        run: tofu fmt -check -diff -recursive

  tofu-test:
    name: tofu test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run OpenTofu commands
        shell: nix shell --inputs-from .. nixpkgs#opentofu --quiet --command bash {0}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          tofu init
          tofu test

  zizmor:
    name: lint github actions by zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Run zizmor command
        shell: nix shell --inputs-from . nixpkgs#zizmor --quiet --command bash {0}
        run: zizmor --persona=pedantic .github
