# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/inventory.json

all:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
    # The "host_ips" variable is configured in "group_vars/all.yml",
    # which is encrypted by ansible-vault.
    ansible_host: "{{ host_ips[inventory_hostname] }}"
  hosts:
    node_1:
    node_2:
    node_3:

# All nodes participate in the Consul cluster.
consul:
  hosts:
    node_1:
    node_2:
    node_3:

# All nodes have Mongo installed, but have their specific roles.
mongodb:
  hosts:
    node_1:
      mongo_role: primary
    node_2:
      mongo_role: secondary
    node_3:
      mongo_role: arbiter

# Only one node hosts the docker registry.
# But all nodes should trust the self-signed certificate.
# e.g. by this condition:
# `when: inventory_hostname == groups['registry'][0]`
registry:
  hosts:
    node_1: # cert trusted by docker daemon. registry is deployed here.
    node_2: # cert trusted by docker daemon.
    node_3: # cert trusted by docker daemon.

# Deploy pocket-id in one node.
pocketid:
  hosts:
    node_1:
